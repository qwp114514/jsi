name: build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 NDK r26d
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: 拉取依赖 (imgui + zygisk.hpp)
        run: |
          mkdir -p third_party
          git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui.git third_party/imgui
          curl -fsSL -o third_party/zygisk.hpp \
            https://raw.githubusercontent.com/Perfare/Zygisk-Il2CppDumper/master/module/src/main/cpp/zygisk.hpp

      - name: 编译
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DANDROID_STL=c++_static \
            -DIMGUI_DIR="$PWD/third_party/imgui" -DZYGISK_DIR="$PWD/third_party"
          cmake --build build -j"$(nproc)"

      - name: 打包 Magisk 模块
        run: |
          STAGE=pkg
          mkdir -p $STAGE/zygisk
          cp module/module.prop module/customize.sh module/post-fs-data.sh module/service.sh module/uninstall.sh $STAGE/
          cp build/libaux.so $STAGE/zygisk/arm64-v8a.so
          [ -d res ] && cp -r res/. $STAGE/common/ || true
          cd $STAGE && zip -qr ../aux-hardened.zip . -x '.*'

      - uses: actions/upload-artifact@v4
        with:
          name: aux-hardened
          path: aux-hardened.zip
